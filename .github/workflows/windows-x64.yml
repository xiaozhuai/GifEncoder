name: windows-x64

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare build
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -GNinja -B build .
          cmake --build build --target all
          cd build
          egif_demo.exe
      - name: Copy File
        shell: bash
        run: |
          cd build
          mkdir egif
          mkdir egif/bin/
          mkdir egif/include
          mkdir egif/lib
          mkdir egif/gif
          cp -rf ../frames egif/
          cp -f *.gif egif/gif/
          cp -f egif_demo.exe egif/bin/
          cp -f egif.lib egif/lib/
          cp -f ../egif/GifEncoder.h egif/include/
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: egif-windows-x64
          path: build/egif